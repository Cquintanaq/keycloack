global:
  tlsDisable: true

server:
  image:
    repository: hashicorp/vault
    tag: "1.18.3"

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address     = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

      api_addr = "http://vault.vault.svc.cluster.local:8200"

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: "local-path"
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  serviceAccount:
    create: true
    name: "vault"

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  enabled: true
  image:
    repository: hashicorp/vault-k8s
    tag: "1.5.0"
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 250m
